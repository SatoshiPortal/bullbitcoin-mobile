targets:
  $default:
    builders:
      drift_dev:
        enabled: false
      drift_dev:analyzer:
        enabled: true
        options: &drift_options
          store_date_time_values_as_text: true
          databases:
            signer_devices_database: lib/src/data/signer_devices.dart
          schema_dir: lib/src/data/schemas/
          test_dir: test/migrations_test/
      drift_dev:modular:
        enabled: true
        options: *drift_options
