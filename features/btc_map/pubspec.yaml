name: btc_map
description: Places that accept bitcoin, from BTC Map, synced and cached on the device and drawn on an OpenStreetMap map in the bull_ui theme, for Bull Bitcoin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.14.0"
  flutter: "3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.1.1
  go_router: ^18.1.4
  intl: any
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  bull_logger:
  bull_ui:
  dio: ^5.9.0
  # Map renderer, pinned exactly because it pins the native MapLibre SDKs (Android 13.5.0, iOS SPM 6.28.0). Not 0.28.x: its iOS SDK 7.0.0 needs iOS 15.5 and the app supports 15.0. Not the newer `maplibre` package: it needs jni >=0.15, which conflicts with sentry_flutter 9.x (jni 0.14.x).
  maplibre_gl: 0.27.1
  material_ui: ^1.11.0
  meta: ^1.17.0
  primitives:

dev_dependencies:
  build_runner: ^2.10.4
  freezed: ^4.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
