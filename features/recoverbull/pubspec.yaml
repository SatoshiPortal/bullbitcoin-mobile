name: bull_recoverbull
description: RecoverBull backup and recovery workflows backed by Secrets.
publish_to: none
version: 0.1.0

environment:
  sdk: "3.12.2"
  flutter: "3.44.9"

resolution: workspace

flutter:
  generate: true

dependencies:
  flutter:
    sdk: flutter
  primitives:
  secrets:
  bull_logger:
  bull_tor:
  bull_ui:
  screen_privacy:
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  file_picker: 10.3.6
  googleapis: ^15.0.0
  google_sign_in: ^6.3.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.29.0
  convert: ^3.1.2
  crypto: ^3.0.7
  meta: ^1.17.0
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 293b0d709f6c7775180f775c6a5fe99a39f175ce

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.29.0
  sqlite3: ^3.5.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
