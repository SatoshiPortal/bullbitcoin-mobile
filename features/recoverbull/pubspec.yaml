name: bull_recoverbull
description: RecoverBull encrypted-backup capability for Bull Bitcoin Mobile.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"
  flutter: "3.44.9"

resolution: workspace

flutter:
  generate: true
  assets:
    - assets/animations/
    - assets/misc/

dependencies:
  bull_logger:
  bull_tor:
  bip32_keys: ^3.1.1
  bip39_mnemonic: ^4.1.0
  bip85_entropy: ^1.0.2
  convert: ^3.1.2
  crypto: ^3.0.7
  dart_mappable: ^4.8.0
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^17.0.0
  bull_ui:
  gif: ^2.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  bloc_concurrency: ^0.3.0
  file_picker: 10.3.6
  meta: ^1.17.0
  primitives:
  googleapis: ^15.0.0
  google_sign_in: ^6.3.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  path: ^1.9.1
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 293b0d709f6c7775180f775c6a5fe99a39f175ce
  sqlite3: ^2.9.4

dev_dependencies:
  build_runner: ^2.10.4
  dart_mappable_builder: ^4.8.0
  drift_dev: ^2.29.0
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  mocktail: ^1.0.4
