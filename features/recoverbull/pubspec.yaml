name: bull_recoverbull
description: RecoverBull backup and recovery workflows backed by Secrets.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

flutter:
  generate: true

dependencies:
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  primitives:
  secrets:
  bull_logger:
  bull_tor:
  bull_ui:
  screen_privacy:
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  file_picker: ^13.3.3
  googleapis: ^15.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.35.4
  convert: ^3.1.2
  crypto: ^3.0.7
  meta: ^1.17.0
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 293b0d709f6c7775180f775c6a5fe99a39f175ce

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.35.3
  sqlite3: ^3.5.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
