def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Beta-channel signing, back-ported from the current tree so that a beta built
// from this legacy tag carries the SAME applicationId (.beta suffix) and the
// SAME signing cert as a beta built from develop. Android matches upgrades on
// applicationId + signing cert, so both are required for the new build to
// install over this one and see its secure-storage data.
def betaKeystoreProperties = new Properties()
def betaKeystorePropertiesFile = rootProject.file('key-beta.properties')
if (betaKeystorePropertiesFile.exists()) {
    betaKeystoreProperties.load(new FileInputStream(betaKeystorePropertiesFile))
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdk = 34

    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = 'com.bullbitcoin.mobile'
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        beta {
            keyAlias betaKeystoreProperties['keyAlias']
            keyPassword betaKeystoreProperties['keyPassword']
            storeFile betaKeystoreProperties['storeFile'] ? file(betaKeystoreProperties['storeFile']) : null
            storePassword betaKeystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // No signingConfig here on purpose: AGP resolves a build-type
            // signingConfig ahead of a flavor's, which would stop the beta
            // flavor from using its own key. Set per-flavor below instead.
        }
    }

    flavorDimensions = ['channel']
    productFlavors {
        production {
            dimension 'channel'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        beta {
            dimension 'channel'
            applicationIdSuffix '.beta'
            if (betaKeystorePropertiesFile.exists()) {
                signingConfig signingConfigs.beta
            }
        }
    }

    namespace 'com.bullbitcoin.mobile'
}

flutter {
    source '../..'
}