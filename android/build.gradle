rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
            project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdk = rootProject.properties['android.compileSdk'].toInteger()
                buildToolsVersion rootProject.properties['android.buildToolsVersion']
            }
        }
        if (project.hasProperty('android')) {
            project.android {
                // Required for subprojects that have not adapted to requiring a namespace
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

// Force subprojects to compile Java/Kotlin to Java 21:
subprojects {
    afterEvaluate { project ->
        project.plugins.withId("org.jetbrains.kotlin.android") {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.toVersion(rootProject.properties['android.jvmTarget'])
                    targetCompatibility JavaVersion.toVersion(rootProject.properties['android.jvmTarget'])
                }
            }
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = rootProject.properties['android.jvmTarget']
            }
        }
    }
}

// Workaround: no_screenshot 1.1.0 lists `src/main/kotlin` twice, which the K2
// frontend (Kotlin 2.2.10) rejects as "Conflicting declarations". Dedup its
// Kotlin source dirs by canonical path.
// TODO: consider moving to a more maintained screenshot-prevention plugin.
subprojects {
    afterEvaluate { project ->
        if (project.name == 'no_screenshot') {
            def kotlinExt = project.extensions.findByName('kotlin')
            kotlinExt?.sourceSets?.configureEach { ss ->
                ss.kotlin.setSrcDirs(ss.kotlin.srcDirs.collect { it.canonicalFile }.unique())
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
