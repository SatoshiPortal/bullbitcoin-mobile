rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
            project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdk = rootProject.properties['android.compileSdk'].toInteger()
                buildToolsVersion rootProject.properties['android.buildToolsVersion']
            }
        }
        if (project.hasProperty('android')) {
            project.android {
                // Required for subprojects that have not adapted to requiring a namespace
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

// Force subprojects to compile Java/Kotlin to Java 21:
subprojects {
    afterEvaluate { project ->
        project.plugins.withId("org.jetbrains.kotlin.android") {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.toVersion(rootProject.properties['android.jvmTarget'])
                    targetCompatibility JavaVersion.toVersion(rootProject.properties['android.jvmTarget'])
                }
            }
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = rootProject.properties['android.jvmTarget']
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Lock every APK compile/runtime graph, including transitive version ranges.
// Test-only configurations are independent of the distributed APK.
allprojects {
    dependencyLocking {
        lockMode = LockMode.STRICT
        lockFile = file("${rootDir}/gradle/dependency-locks/${project.name}.lockfile")
    }
    configurations.configureEach {
        if ((name.endsWith('CompileClasspath') || name.endsWith('RuntimeClasspath')) &&
            !name.toLowerCase().contains('test')) {
            resolutionStrategy.activateDependencyLocking()
        }
    }
}

// Refresh only during an explicit dependency update; review lock and hash diffs.
tasks.register('resolveApkDependencies') {
    doLast {
        allprojects.each { p ->
            p.configurations.findAll { c ->
                c.canBeResolved &&
                    (c.name.endsWith('CompileClasspath') || c.name.endsWith('RuntimeClasspath')) &&
                    !c.name.toLowerCase().contains('test')
            }.each { c ->
                c.incoming.artifactView {
                    componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.files.files
            }
        }
    }
}
