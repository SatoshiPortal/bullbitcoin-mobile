# Shared Flutter toolchain setup for tests and the cache warmer. The x64
# checks and shards use generated code from their workflow's preparation job.
#
# Cache notes: keys derive from lockfiles, so they self-invalidate when deps
# change. When parallel jobs miss the same key (lockfile just changed),
# they all try to save — the first save wins, the others log a
# benign "cache already exists" warning. No restore-keys on the pub cache on
# purpose: it holds git dependency clones, and a fuzzy fallback can restore a
# checkout from an OLDER lock whose pinned commit differs; pub then resolves
# against that stale clone and `pub get --enforce-lockfile` fails wanting to
# drop deps. The exact key already pins the commit via pubspec.lock.
name: Flutter setup
description: FVM + pub caches, FVM install, deps, build_runner, translations

inputs:
  cargo-cache:
    description: Also restore Cargo registry sources and git checkouts
    required: false
    default: 'false'
  codegen-artifact:
    description: Artifact ID from the x64 preparation job, if code has already been generated for this revision
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Bark's prost-build needs protoc even when a native cache is cold in a
    # unit-test shard. Install for the host before any dependency/codegen hook.
    - name: Install pinned protobuf compiler
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64)
            protoc_arch=x86_64
            protoc_sha=f3340e28a83d1c637d8bafdeed92b9f7db6a384c26bca880a6e5217b40a4328b
            ;;
          aarch64|arm64)
            protoc_arch=aarch_64
            protoc_sha=6018147740548e0e0f764408c87f4cd040e6e1c1203e13aeacaf811892b604f3
            ;;
          *) echo "Unsupported protoc host architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        # Official release asset digests:
        # https://github.com/protocolbuffers/protobuf/releases/expanded_assets/v33.1
        protoc_archive="$RUNNER_TEMP/protoc-33.1-linux-${protoc_arch}.zip"
        protoc_dir="$RUNNER_TEMP/protoc-33.1"
        curl --retry 5 --retry-all-errors -fL \
          "https://github.com/protocolbuffers/protobuf/releases/download/v33.1/protoc-33.1-linux-${protoc_arch}.zip" \
          -o "$protoc_archive"
        echo "$protoc_sha  $protoc_archive" | sha256sum --check --strict
        mkdir -p "$protoc_dir"
        unzip -q -o "$protoc_archive" -d "$protoc_dir"
        test "$("$protoc_dir/bin/protoc" --version)" = 'libprotoc 33.1'
        test -f "$protoc_dir/include/google/protobuf/descriptor.proto"
        echo "$protoc_dir/bin" >> "$GITHUB_PATH"
        echo "PROTOC=$protoc_dir/bin/protoc" >> "$GITHUB_ENV"

    # Native Assets hooks compile the Rust crates with these pinned compilers.
    # Every caller, the cache warmer included, installs them here so that the
    # compilers, PATH and RUSTUP_* variables match across jobs. The arm64
    # runner may lack rustup, so it is installed there first.
    - name: Install pinned Rust toolchains
      shell: bash
      run: |
        # The makefile is the single source of the pinned compilers.
        make -s rust-versions >> "$GITHUB_ENV"
        eval "$(make -s rust-versions)"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        rustup toolchain install "$RUST_VERSION" --profile minimal
        rustup component add --toolchain "$RUST_VERSION" clippy rustfmt
        # Official hosted Payjoin explicitly selects its own compiler.
        rustup toolchain install "$PAYJOIN_RUST_VERSION" --profile minimal
        rustup component add --toolchain "$PAYJOIN_RUST_VERSION" clippy rustfmt
        # Bark selects its own compiler; host std matches the runner architecture.
        rustup toolchain install "$BARK_RUST_VERSION" --profile minimal
        rustup component add --toolchain "$BARK_RUST_VERSION" clippy rustfmt
        rustup run "$BARK_RUST_VERSION" rustc --version | grep -F "rustc $BARK_RUST_VERSION"
        rustup run "$RUST_VERSION" rustc --version | grep -F "rustc $RUST_VERSION"
        rustup run "$PAYJOIN_RUST_VERSION" rustc --version | grep -F "rustc $PAYJOIN_RUST_VERSION"
        echo RUSTUP_AUTO_INSTALL=0 >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"

    # runner.arch is in the FVM key because the SDK is native binaries — an
    # x64 SDK restored on an arm64 runner is broken. pub/cargo caches hold
    # sources only (arch-independent), so they keep os-only keys and stay
    # shared across arches.
    - name: Cache Flutter SDK (FVM)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc') }}

    - name: Cache pub (hosted + git deps)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

    - name: Cache Cargo (FRB native crates)
      if: ${{ inputs.cargo-cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/rust_bindings/rust/Cargo.lock', 'packages/onion/rust/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Install FVM
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) fvm_arch=x64 ;;
          aarch64|arm64) fvm_arch=arm64 ;;
          *) echo "Unsupported FVM architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/fvm-4.1.2-linux-${fvm_arch}.tar.gz"
        curl --retry 5 --retry-all-errors -fL \
          "https://github.com/conceptadev/fvm/releases/download/4.1.2/fvm-4.1.2-linux-${fvm_arch}.tar.gz" \
          -o "$archive"
        mkdir -p "$HOME/fvm/bin"
        # Extract the whole tree, not just `fvm/fvm`: the two release archives
        # have different layouts. x64 ships a self-contained binary, arm64 a
        # launcher script that execs `src/dart` relative to its own directory —
        # unpacking the launcher alone yields `exec: .../src/dart: not found`
        # on every fvm invocation.
        tar -xzf "$archive" -C "$HOME/fvm/bin" --strip-components=1
        chmod +x "$HOME/fvm/bin/fvm"
        if [ -f "$HOME/fvm/bin/src/dart" ]; then
          chmod +x "$HOME/fvm/bin/src/dart"
        fi
        # Prove the launcher actually runs before anything depends on it.
        "$HOME/fvm/bin/fvm" --version
        echo "$HOME/fvm/bin" >> $GITHUB_PATH

    - name: Check Flutter version
      shell: bash
      run: make fvm-check

    - name: Get dependencies
      shell: bash
      run: make deps

    # build_runner's incremental cache — RESTORE ONLY. PR jobs never save (a sha-keyed save per push would blow the 10GB repo cache quota and evict the FVM/pub/cargo caches); only the cache-warmer workflow saves, on develop pushes, so all PRs restore develop's latest warm snapshot.
    # ALL gitignored generated source files are cached alongside .dart_tool/build so the restored state is self-consistent (outputs present + asset graph present); build_runner hashes inputs itself and regenerates what changed.
    # The suffix list MUST cover every gitignored to-source output: build_runner trusts .dart_tool/build and will NOT regenerate an output whose file is missing from disk (it reports "N skipped"), so a suffix left out here is silently absent after restore and breaks the build — that is how the missing assets.gen.dart (flutter_gen, *.gen.dart ≠ *.g.dart) incident happened.
    # *.gr.dart / *.config.dart match nothing today but are pre-listed to mirror the format-filter regex (makefile format-check), so adding auto_route/injectable later cannot reproduce the incident; *.steps.dart is deliberately NOT cached — drift schema snapshots are git-tracked, and restoring a tracked file would overwrite the checkout (same reason main.directories.g.dart is excluded below).
    # Arch is in the key defensively: the build cache holds kernel/asset hashes we don't want shared across arches.
    # The key embeds hashFiles of this action and the warmer workflow, so any edit to either file self-busts the cache instead of restoring a stale pre-edit snapshot — no manual version token to bump (this replaced the short-lived -v2- token).
    # Keep path + key in sync with the save step in cache-warmer.yml.
    - name: Restore build_runner cache
      if: ${{ inputs.codegen-artifact == '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .dart_tool/build
          **/*.g.dart
          **/*.freezed.dart
          **/*.drift.dart
          **/*.mocks.dart
          **/*.gen.dart
          **/*.gr.dart
          **/*.config.dart
          !packages/bull_ui_catalogue/lib/main.directories.g.dart
        key: buildrunner-${{ hashFiles('.github/actions/flutter-setup/action.yml', '.github/workflows/cache-warmer.yml') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
        restore-keys: buildrunner-${{ hashFiles('.github/actions/flutter-setup/action.yml', '.github/workflows/cache-warmer.yml') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}-

    # A restored snapshot can reference outputs of files deleted since it was saved (e.g. a source removed from a workspace package): build_runner then aborts with InvalidOutputException instead of rebuilding. Retry once from scratch so a stale snapshot never breaks the job.
    # build_runner runs the Native Assets hooks, which compile every Rust crate
    # for the host (~17 min on a 4-vCPU runner). The hooks skip that work when
    # their recorded inputs, sources and environment (HOME, PATH, RUSTUP_*) are
    # unchanged and the built libraries exist, so only those records and the
    # final libraries are cached (~130 MB), not Cargo's multi-GB target dirs.
    # A stale entry is harmless: the hooks detect it and rebuild. Saved by
    # cache-warmer.yml on develop; the paths must stay identical there.
    - name: Restore Native Assets hook outputs
      if: ${{ inputs.codegen-artifact == '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .dart_tool/hooks_runner/*/*/*.json
          .dart_tool/hooks_runner/*/*/hook.dill
          .dart_tool/hooks_runner/*/*/hook.dill.d
          .dart_tool/hooks_runner/shared/*/build/*/target/*/release/*.so
          .dart_tool/hooks_runner/shared/*/build/download-*/*.so
        key: hooks-${{ hashFiles('.github/actions/flutter-setup/action.yml') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'packages/rust_bindings/rust/Cargo.lock', 'packages/onion/rust/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          hooks-${{ hashFiles('.github/actions/flutter-setup/action.yml') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'packages/rust_bindings/rust/Cargo.lock', 'packages/onion/rust/Cargo.lock') }}-
          hooks-${{ hashFiles('.github/actions/flutter-setup/action.yml') }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Generate code (build_runner)
      if: ${{ inputs.codegen-artifact == '' }}
      shell: bash
      run: |
        if ! make build-runner; then
          echo "::warning::build_runner failed on the restored cache; rebuilding from scratch"
          rm -rf .dart_tool/build
          make build-runner
        fi

    - name: Download generated code and Native Assets
      if: ${{ inputs.codegen-artifact != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.codegen-artifact }}
        path: ${{ runner.temp }}/flutter-codegen

    - name: Unpack generated code and Native Assets
      if: ${{ inputs.codegen-artifact != '' }}
      shell: bash
      run: tar -xzf "$RUNNER_TEMP/flutter-codegen/flutter-codegen.tar.gz"

    - name: Generate translations
      shell: bash
      run: make translations

    - name: Disk telemetry (for trimming free-disk later)
      shell: bash
      run: df -h /
