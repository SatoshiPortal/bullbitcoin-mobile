name: Reproducibility scripts
on:
  pull_request:
    branches: [develop, main]
    paths:
      - makefile
      - 'reproducibility/**'
      - '.github/workflows/reproducibility-scripts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make reproducibility-scripts-test
