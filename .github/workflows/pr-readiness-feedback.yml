name: PR readiness feedback

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is privileged. Checkout is pinned to the trusted
      # base SHA and never checks out, reads, or executes PR-head content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readiness } = require('./tools/pr_governance/policy');
            const p = context.payload.pull_request;
            let cursor = null, pr, refs = [];
            do {
              const data = await github.graphql(`query($owner:String!,$name:String!,$number:Int!,$cursor:String){ repository(owner:$owner,name:$name){ pullRequest(number:$number){ author{login} labels(first:100){nodes{name}} closingIssuesReferences(first:100,after:$cursor){nodes{state repository{nameWithOwner} labels(first:100){nodes{name}}} pageInfo{hasNextPage endCursor}}}}}`, { owner: context.repo.owner, name: context.repo.name, number: p.number, cursor });
              pr = data.repository.pullRequest;
              refs = refs.concat(pr.closingIssuesReferences.nodes);
              cursor = pr.closingIssuesReferences.pageInfo.hasNextPage ? pr.closingIssuesReferences.pageInfo.endCursor : null;
            } while (cursor);
            const result = readiness({ repository: { nameWithOwner: `${context.repo.owner}/${context.repo.repo}` }, author: pr.author, labels: pr.labels.nodes, closingIssuesReferences: refs });
            const marker = '<!-- bull-pr-readiness-feedback -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: p.number, per_page: 100 });
            const body = `${marker}\n${result.ready ? 'Thanks for linking a ready issue (or using an approved exemption); PR readiness is satisfied.' : 'Thanks for your contribution. Please link an open local issue labelled `ready`, or add `no-issue-needed` when the exemption applies. Anyone can comment on the issue and mention project maintainers for triage or prioritization.'}`;
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: p.number, body });
            if (result.ready) {
              try { await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: p.number, name: 'not-ready' }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            else await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: p.number, labels: ['not-ready'] });
