name: PR readiness

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    name: PR readiness
    runs-on: ubuntu-latest
    steps:
      # This is the trusted base, never the PR head. It supplies only the pure
      # policy module; the check still evaluates live metadata through GraphQL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readiness } = require('./tools/pr_governance/policy');
            const owner = context.repo.owner, name = context.repo.repo;
            let cursor = null, refs = [];
            do {
              const data = await github.graphql(`query($owner:String!,$name:String!,$number:Int!,$cursor:String){ repository(owner:$owner,name:$name){ pullRequest(number:$number){ author{login} labels(first:100){nodes{name}} closingIssuesReferences(first:100,after:$cursor){nodes{state repository{nameWithOwner} labels(first:100){nodes{name}}} pageInfo{hasNextPage endCursor}}}}}`, { owner, name, number: context.issue.number, cursor });
              const pr = data.repository.pullRequest;
              if (!pr) core.setFailed('Pull request metadata is unavailable');
              if (!global.pr) global.pr = { repository: { nameWithOwner: `${owner}/${name}` }, author: pr.author, labels: pr.labels.nodes, closingIssuesReferences: [] };
              refs = refs.concat(pr.closingIssuesReferences.nodes); cursor = pr.closingIssuesReferences.pageInfo.hasNextPage ? pr.closingIssuesReferences.pageInfo.endCursor : null;
            } while (cursor);
            global.pr.closingIssuesReferences = refs;
            const result = readiness(global.pr);
            if (!result.ready) core.setFailed(`PR is not ready: ${result.reason}. Link an open local issue labelled ready, or use the no-issue-needed exemption.`);
            else core.info(`PR readiness passed (${result.reason})`);
