name: Analyze and Test

on:
  pull_request:
    branches:
      - main
      - develop
      # Silent-payments staging branch: PRs (e.g. #2408) target it instead of
      # develop, and the filter is evaluated against the PR's base branch.
      - feat/sp-9-26
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  # Develop always runs the full suite; pull requests select impacted unit-test
  # members and workflow_dispatch provides a full run for an arbitrary branch.
  push:
    branches:
      - develop
  # The funded Payjoin fixture spends from shared testnet wallets. It runs only
  # for main PRs and manual runs, never for the concurrent develop stack.
  workflow_dispatch:

# Checkout + tests only; no writes to the repo via the token.
permissions:
  contents: read
  issues: read
  pull-requests: read

# Cancel superseded runs on the same PR — these builds are heavy (Rust FRB
# crates + Flutter SDK + Linux GTK app + integration tests), so don't run stale
# commits to completion when newer ones are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# After the prechecks, x64 code generation and arm64 integration run in
# parallel. All x64 test jobs consume the generated output of their own run.
jobs:
  classification:
    name: Detect docs-only PR
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    outputs:
      run_app_checks: ${{ steps.classify.outputs.run_app_checks }}
    steps:
      - name: Classify pull request files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_app_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api_url="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files"
          page=1
          file_count=0
          run_app_checks=false

          while :; do
            response=$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 1 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?per_page=100&page=${page}")

            if ! jq -e 'type == "array"' >/dev/null <<<"$response"; then
              echo "Changed-file API returned a non-array response" >&2
              exit 1
            fi
            if ! jq -e 'all(.[]; type == "object" and (.filename | type == "string"))' >/dev/null <<<"$response"; then
              echo "Changed-file API returned an invalid file entry" >&2
              exit 1
            fi

            page_count=$(jq 'length' <<<"$response")
            while IFS= read -r path; do
              file_count=$((file_count + 1))
              case "$path" in
                WORKSPACE.md|DEPENDENCIES.md)
                  run_app_checks=true
                  ;;
                *.md|docs/*|LICENSE|.gitignore|.git-blame-ignore-revs|.github/ISSUE_TEMPLATE/*)
                  ;;
                *)
                  run_app_checks=true
                  ;;
              esac
            done < <(jq -r '.[].filename // empty' <<<"$response")

            (( page_count < 100 )) && break
            page=$((page + 1))
          done

          if (( file_count == 0 )); then
            echo "Changed-file enumeration returned an impossible empty set" >&2
            exit 1
          fi

          echo "Enumerated ${file_count} changed file(s); application checks: ${run_app_checks}"
          echo "run_app_checks=${run_app_checks}" >> "$GITHUB_OUTPUT"

  action-pins:
    name: Check action pins
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      # Bootstrap from the immutable commit that introduced the checker. This
      # lets the introducing PR verify itself before the file exists on the
      # base branch; checker upgrades require an explicit SHA bump here.
      - name: Checkout candidate tree (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout trusted checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: 79342f5f4e761f020453d0f78e42b15791f08faf
          persist-credentials: false
      - name: Verify external action pins
        run: bash trusted/tools/check_action_pins.sh "$GITHUB_WORKSPACE/candidate"

  readiness:
    name: PR readiness
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Skip PR readiness outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "PR readiness is not applicable to push or manual runs."
      # Bootstrap from the immutable commit that introduced the policy. This
      # lets the introducing PR verify itself before the file exists on the
      # base branch; policy upgrades require an explicit SHA bump here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const { readiness } = require('./tools/pr_governance/policy');
            const owner = context.repo.owner, name = context.repo.repo;
            let cursor = null, refs = [];
            do {
              const data = await github.graphql(`query($owner:String!,$name:String!,$number:Int!,$cursor:String){ repository(owner:$owner,name:$name){ pullRequest(number:$number){ author{login} labels(first:100){nodes{name}} closingIssuesReferences(first:100,after:$cursor){nodes{state repository{nameWithOwner} labels(first:100){nodes{name}}} pageInfo{hasNextPage endCursor}}}}}`, { owner, name, number: context.issue.number, cursor });
              const pr = data.repository.pullRequest;
              if (!pr) core.setFailed('Pull request metadata is unavailable');
              if (!global.pr) global.pr = { repository: { nameWithOwner: `${owner}/${name}` }, author: pr.author, labels: pr.labels.nodes, closingIssuesReferences: [] };
              refs = refs.concat(pr.closingIssuesReferences.nodes); cursor = pr.closingIssuesReferences.pageInfo.hasNextPage ? pr.closingIssuesReferences.pageInfo.endCursor : null;
            } while (cursor);
            global.pr.closingIssuesReferences = refs;
            const result = readiness(global.pr);
            if (!result.ready) core.setFailed(`PR is not ready: ${result.reason}. Link an open local issue labelled ready, or use the no-issue-needed exemption.`);
            else core.info(`PR readiness passed (${result.reason})`);

  prepare-x64:
    needs: [classification, action-pins, readiness]
    if: ${{ !cancelled() && needs.classification.result == 'success' && needs.action-pins.result == 'success' && needs.readiness.result == 'success' && needs.classification.outputs.run_app_checks == 'true' }}
    name: Prepare generated code (x64)
    runs-on: ubuntu-24.04
    # A cold build compiles the host Rust hooks before running the generators.
    # Give that work its own deadline so it cannot consume the test budget.
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      unit-test-mode: ${{ steps.unit-tests.outputs.mode }}
      unit-test-packages: ${{ steps.unit-tests.outputs.packages }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The impacted-test selector compares the PR base and head commits.
          fetch-depth: 0

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      - name: Select impacted unit test packages
        id: unit-tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--event-name "$EVENT_NAME" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$EVENT_NAME" == pull_request ]]; then
            args+=(--base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")
          fi
          python3 tools/impacted_unit_tests.py "${args[@]}"

      # Diagnostic, compared with the same step in unit shard 1: hooks_runner reruns a hook when one of these variables changes, so print a short hash of each value, never the value.
      - name: Fingerprint the Native Assets hook environment
        run: python3 tools/trace_access_hooks.py --fingerprint

      - name: Pack generated code and Native Assets
        shell: bash
        run: |
          shopt -s nullglob
          # Match the build_runner cache's source suffixes, and let Git
          # exclude tracked files. Dart and Cargo intermediates stay here.
          git ls-files --others --ignored --exclude-standard -z -- \
            '*.g.dart' '*.freezed.dart' '*.drift.dart' '*.mocks.dart' \
            '*.gen.dart' '*.gr.dart' '*.config.dart' \
            ':(exclude,glob)**/.dart_tool/**' ':(exclude,glob)**/build/**' \
            > "$RUNNER_TEMP/flutter-codegen-files"
          test -s "$RUNNER_TEMP/flutter-codegen-files"
          # Preserve the hook records and libraries at their original paths.
          native_files=(
            .dart_tool/hooks_runner/*/*/*.json
            .dart_tool/hooks_runner/*/*/hook.dill
            .dart_tool/hooks_runner/*/*/hook.dill.d
            .dart_tool/hooks_runner/shared/*/build/*/target/*/release/*.so
            .dart_tool/hooks_runner/shared/*/build/download-*/*.so
          )
          test "${#native_files[@]}" -gt 0
          printf '%s\0' "${native_files[@]}" >> "$RUNNER_TEMP/flutter-codegen-files"
          tar --format=pax -czf "$RUNNER_TEMP/flutter-codegen.tar.gz" \
            --null -T "$RUNNER_TEMP/flutter-codegen-files"

      - name: Upload generated code and Native Assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-codegen-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-codegen.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  checks:
    needs: prepare-x64
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    # Measured 2026-11-14 on develop: ~18 min of setup (free disk, Flutter,
    # build_runner), ~3 min of static checks, then the unit suites alone pass
    # 27 min (the app suite is ~22 min of that), so 45 min cancelled healthy
    # runs with every test still green. Raised to 90 min on 2026-11-23: the
    # sibling unit-shards job already allows 90, and a slow runner must not
    # cancel a green run.
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PR governance and custody imports (CI only)
        run: make pr-governance-ci-test custody-ci-check

      # The gates below reference steps.setup.outcome — if this `id` is ever
      # renamed, the expression silently evaluates to '' and every check
      # SKIPS (job goes green with nothing run). Keep id and gates in sync.
      - name: Flutter setup
        id: setup
        uses: ./.github/actions/flutter-setup
        with:
          codegen-artifact: ${{ needs.prepare-x64.outputs.artifact }}

      # Static checks are gated on `!cancelled()` + setup success
      # instead of the implicit success(): one CI run surfaces ALL static
      # failures instead of stopping at the first (they're independent and
      # cheap, ~1.5min combined). `!cancelled()` (not `always()`) so a
      # superseded run cancelled by the concurrency group stops immediately.
      # `make checks` runs the Dart/Flutter gates locally; the Node gates above run only in CI.
      - name: Linter shouldn't raise errors, warnings or infos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make analyze

      - name: Workspace dependency docs should be current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make workspace-graph-check

      - name: bull_ui import boundary (coins/ui imports only package:bull_ui)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make bull-ui-check

      - name: Custody key material (resolved derivation and vault decryption)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make custody-check

      - name: Native stores have exactly one writer
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make native-write-check

      - name: Secrets public API trees should be current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make secrets-api-docs-check

      - name: Sync public API trees should be current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make sync-api-docs-check

      - name: dart fix should have nothing to suggest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make fix-check

      # The gate's filter regex and pipefail rationale live in the makefile's format-check target; the staged-files variant in .git_hooks/pre-commit keeps its own copy of the regex.
      - name: dart format should have nothing to change
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make format-check

      - name: Rust compiler pin verifier regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make rustc-pins-test

      - name: Unit test shard script regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make unit-test-shard-test

      # Debug builds and tests run on the JIT, so only this catches a Dart AOT compiler crash before a release build does (dart-lang/sdk#64917).
      - name: Release AOT snapshot compiles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make aot-check

      # Default success() gate on purpose: if any static check above is red,
      # skip the tests — the PR needs another push anyway.
      # This job runs shard 0 of the unit tests; unit-shards runs the others in parallel.
      - name: Unit tests must pass (shard 0 of 3)
        env:
          TEST_PACKAGES: ${{ needs.prepare-x64.outputs.unit-test-packages }}
        run: make unit-test TEST_TOTAL_SHARDS=3 TEST_SHARD_INDEX=0

  # Each shard gets a disjoint third of every member's test files and uses
  # the same generated code as checks.
  unit-shards:
    needs: prepare-x64
    name: Unit tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup
        with:
          codegen-artifact: ${{ needs.prepare-x64.outputs.artifact }}

      - name: Fingerprint the Native Assets hook environment
        if: matrix.shard == 1
        run: python3 tools/trace_access_hooks.py --fingerprint

      - name: Unit tests must pass
        env:
          TRACE_ACCESS_SHARD: ${{ matrix.shard == 1 && '1' || '0' }}
          TRACE_ACCESS_HOOKS: '1'
          TEST_PACKAGES: ${{ needs.prepare-x64.outputs.unit-test-packages }}
        # FVM adds its SDK directory to PATH for each nested invocation.
        # Keep Access aligned with the single FVM invocation in prepare-x64.
        run: ACCESS_UNIT_TEST_PATH="$PATH" make unit-test TEST_TOTAL_SHARDS=3 TEST_SHARD_INDEX=${{ matrix.shard }}

  integration:
    needs: [classification, action-pins, readiness]
    if: ${{ !cancelled() && needs.classification.result == 'success' && needs.action-pins.result == 'success' && needs.readiness.result == 'success' && needs.classification.outputs.run_app_checks == 'true' }}
    name: Integration tests
    # arm64: free 4-vCPU runners for public repos, native arm execution — the
    # Rust FRB compile is exactly the workload that benefits. If this arch
    # surfaces a toolchain wart, revert this job to ubuntu-24.04 in one commit
    # (x64 runners have ~86 GB free before setup and need no cleanup).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds the FRB Rust crates, the Flutter SDK toolchain and the
      # Linux desktop app on one runner. The arm64 partner image keeps a few
      # big preinstalled dirs, so reclaim them inline;
      # `|| true` because they may not exist on this image. The setup action
      # logs `df -h` to confirm headroom.
      - name: Free disk space (inline, arch-agnostic)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup
        with:
          cargo-cache: 'true'

      - name: Install Linux desktop for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libsecret-tools libcurl4-openssl-dev \
            dbus gnome-keyring \
            xdg-desktop-portal xdg-desktop-portal-gtk \
            libsqlite3-dev xvfb xauth xdg-user-dirs

      # The tests build and launch the real Linux GTK app, which needs a
      # display to init even though the tests themselves render nothing —
      # on a headless runner the app aborts at startup ("log reader
      # stopped unexpectedly / Unable to start the app on the device").
      # xvfb-run gives it a virtual X server. dbus-run-session + an
      # unlocked gnome-keyring provide the Secret Service flutter_secure_storage needs.
      # Tests read the mnemonics via Platform.environment, so the secrets are
      # exported as real env vars (not a .env file, which nothing loads). When a
      # secret is unset (e.g. on forks) the var is empty and the funded-testnet
      # groups skip themselves — "use the mnemonic if available".
      - name: Integration tests (Linux desktop)
        env:
          TEST_ALICE_MNEMONIC: ${{ secrets.ENV_TEST_ALICE_MNEMONIC }}
          TEST_BOB_MNEMONIC: ${{ secrets.ENV_TEST_BOB_MNEMONIC }}
          # The fixture spends from these two shared wallets. It runs as a final
          # delivery gate on PRs to main, rather than for every develop PR in a
          # stack, and can still be run manually for an arbitrary branch.
          RUN_FUNDED_PAYJOIN_TEST: ${{ github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --daemonize --components=secrets
            make integration-test
          '

      # Run separately: the aggregated suite initializes Bull only once on
      # its normal network and cannot select regtest before services start.
      - name: Coins and prices on isolated local regtest
        run: bash tools/local_regtest_integration.sh

      - name: Payjoin on isolated local regtest
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/payjoin-mailrooms"
          cargo build --locked --manifest-path tools/local_payjoin_mailrooms/Cargo.toml
          tools/local_payjoin_mailrooms/build-peer.sh "$RUNNER_TEMP/payjoin-peer"
          tools/local_payjoin_integration.sh --pull-images
          export BULL_PAYJOIN_MAILROOMS="$CARGO_TARGET_DIR/debug/bull-regtest-mailrooms"
          export BULL_PAYJOIN_TEST_PEER="$RUNNER_TEMP/payjoin-peer/bin/payjoin-cli"
          unset CARGO_TARGET_DIR
          tools/local_payjoin_integration.sh

  ci:
    name: CI
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [classification, action-pins, readiness, checks, unit-shards, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the expected checks
        env:
          CLASSIFICATION_RESULT: ${{ needs.classification.result }}
          RUN_APP_CHECKS: ${{ needs.classification.outputs.run_app_checks }}
          ACTION_PINS_RESULT: ${{ needs.action-pins.result }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_SHARDS_RESULT: ${{ needs.unit-shards.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          [[ "$CLASSIFICATION_RESULT" == success ]] || {
            echo "Classification result was ${CLASSIFICATION_RESULT}, expected success" >&2
            exit 1
          }
          [[ "$ACTION_PINS_RESULT" == success ]] || {
            echo "Action-pin result was ${ACTION_PINS_RESULT}, expected success" >&2
            exit 1
          }

          [[ "$READINESS_RESULT" == success ]] || {
            echo "PR readiness result was ${READINESS_RESULT}, expected success" >&2
            exit 1
          }

          case "$RUN_APP_CHECKS" in
            true)
              [[ "$CHECKS_RESULT" == success ]] || {
                echo "Application checks result was ${CHECKS_RESULT}, expected success" >&2
                exit 1
              }
              [[ "$UNIT_SHARDS_RESULT" == success ]] || {
                echo "Unit test shards result was ${UNIT_SHARDS_RESULT}, expected success" >&2
                exit 1
              }
              [[ "$INTEGRATION_RESULT" == success ]] || {
                echo "Integration result was ${INTEGRATION_RESULT}, expected success" >&2
                exit 1
              }
              ;;
            false)
              [[ "$CHECKS_RESULT" == skipped && "$UNIT_SHARDS_RESULT" == skipped && "$INTEGRATION_RESULT" == skipped ]] || {
                echo "Docs-only PR expected every application job to be skipped; got checks=${CHECKS_RESULT}, unit-shards=${UNIT_SHARDS_RESULT}, integration=${INTEGRATION_RESULT}" >&2
                exit 1
              }
              ;;
            *)
              echo "Classification output was '${RUN_APP_CHECKS}', expected true or false" >&2
              exit 1
              ;;
          esac
