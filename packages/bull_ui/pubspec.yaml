name: bull_ui
description: Bull Bitcoin design-system component library (Bull* widgets + theme).
publish_to: "none"
version: 0.0.1
resolution: workspace

environment:
  sdk: "3.14.0"
  flutter: "3.50.1"

dependencies:
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  primitives:
  intl: any
  auto_size_text: ^3.0.0
  keyboard_actions: ^5.0.3
  custom_sliding_segmented_control: ^2.0.0
  gif: ^2.3.0
  shimmer: ^4.0.0
  qr_flutter: ^4.1.0
  sensors_plus: 7.1.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
