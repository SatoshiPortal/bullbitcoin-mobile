targets:
  $default:
    builders:
      drift_dev:
        enabled: false
      drift_dev:analyzer:
        enabled: true
        options: &drift_options
          store_date_time_values_as_text: true
          databases:
            bull_database: lib/src/app_database/sqlite_database.dart
          schema_dir: lib/src/app_database/schemas/
          test_dir: test/migrations_test/
      drift_dev:modular:
        enabled: true
        options: *drift_options
