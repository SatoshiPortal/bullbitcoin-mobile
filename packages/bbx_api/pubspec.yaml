name: bbx_api
description: >-
  Pure-Dart client for the Bull Bitcoin exchange API: authenticated JSON-RPC
  groups that publish owned values and Results, plus the notification socket.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.14.0"

resolution: workspace

dependencies:
  dio: ^5.9.0
  meta: ^1.17.0
  primitives:
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  test: ^1.26.3
