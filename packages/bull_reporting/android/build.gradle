plugins {
    id 'com.android.library'
}

android {
    namespace 'com.bullbitcoin.reporting'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

dependencies {
    // Match the Android SDK bundled by sentry_flutter.
    implementation 'io.sentry:sentry-android:8.66.0'
}
