targets:
  $default:
    builders:
      drift_dev:
        enabled: false
      drift_dev:analyzer:
        enabled: true
        options: &options
          store_date_time_values_as_text: true
          databases:
            electrum_database: lib/src/data/electrum_database.dart
          schema_dir: lib/src/data/schemas/
          test_dir: test/migrations_test/
      drift_dev:modular:
        enabled: true
        options: *options
