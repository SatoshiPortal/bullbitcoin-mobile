name: bull_swap
description: >-
  Pluggable swap engine for Bull Bitcoin: trusted (Bull exchange) and trustless
  (Boltz, incl. custom Boltz servers) providers behind one open/closed port, with
  its own storage. Presentation stays in the app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 88e05c9e9d2911f3dcd44b449ee97e27c73c1e51
      path: packages/bull_sdk
  boltz_stream:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 88e05c9e9d2911f3dcd44b449ee97e27c73c1e51
      path: packages/boltz-stream
  crypto: ^3.0.7
  decimal: ^3.2.4
  dio: ^5.9.0
  drift: ^2.29.0
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  primitives:
  sqlite3: ^2.9.4
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  fake_async: ^1.3.3
  freezed: ^3.2.3
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
