# Novlang manifest: the words a store forces, and the catalogue keys that carry them.
#
# The catalogue words are the real words. Each entry names a catalogue key whose
# text is replaced by an override (`<catalogue>__<key>_<store>` in
# lib/l10n/novlang_<lang>.arb) when the store policy applies. The superuser
# always sees the catalogue text.
#
# Deliberately NOT listed: bank, Interac, E-Transfer, SEPA, SPEI, NFC and PSBT
# wording (fiat rails and transport, not our swaps), search keywords, the legal
# disclosures, and RecoverBull server-communication text.
version: 1
stores:
  apple:
    source: App Store vocabulary decided by the product owner (2026-11-13)
    # Lowercase substrings an override must never contain: `all` applies to
    # every language, the other keys to one language (and its regional
    # variants). Latin-script languages list their own words for swap and
    # exchange; the others are covered by `all` (a Latin loanword).
    blacklist:
      all: [swap, exchange]
      fr: [échang]
      es: [intercambi, cambio]
      de: [tausch, börse]
      pt: [troca, câmbio]
      it: [scambi, cambio]
    replacements:
      swap: transfer
      exchange: account
      exchange rate: rate
  google:
    source: Play policy does not restrict wording for non-custodial wallets
    blacklist:
      all: []
    replacements: {}
# Each catalogue names the package whose l10n.yaml generates it, from the
# repository root; tools/novlang_bridge.dart generates its novlang delegate.
catalogues:
  app:
    path: .
    description: the root catalogue (localization/app_<lang>.arb)
  quick_actions:
    path: features/quick_actions
    description: the quick actions feature catalogue (features/quick_actions/localization/app_<lang>.arb)
  label_editor:
    path: features/label_editor
    description: the label editor catalogue (features/label_editor/lib/l10n/label_editor_<lang>.arb)
  announcements:
    path: features/announcements
    description: the wallet home announcements catalogue
  bitcoin_price:
    path: features/bitcoin_price
    description: fiat display and price charts
  all_seed_view:
    path: features/all_seed_view
    description: authenticated recovery phrase viewer
  receive:
    path: features/receive
    description: Bitcoin, Liquid, Lightning and Payjoin receive screens
  wizard:
    path: features/wizard
    output-dir: features/wizard/lib/generated/novlang
    description: standalone first-run startup wizard
  bull_exchange:
    path: features/bull_exchange
    description: Exchange journeys and account settings
  settings:
    path: features/settings
    description: settings navigation and preferences
  swap:
    path: features/swap
    description: swap recovery and transfer screens
  onboarding:
    path: features/onboarding
    output-dir: features/onboarding/lib/generated/novlang
    description: wallet onboarding and recovery
