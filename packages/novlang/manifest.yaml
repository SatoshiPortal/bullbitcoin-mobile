# Novlang manifest: the words a store forces, and the catalogue keys that carry them.
#
# The catalogue words are the real words. Each entry names a catalogue key whose
# text is replaced by an override (`<catalogue>__<key>_<store>` in
# lib/l10n/novlang_<lang>.arb) when the store policy applies. The superuser
# always sees the catalogue text.
#
# Deliberately NOT listed: bank, Interac, E-Transfer, SEPA, SPEI, NFC and PSBT
# wording (fiat rails and transport, not our swaps), search keywords, the legal
# disclosures, and RecoverBull server-communication text.
version: 1
stores:
  apple:
    source: App Store vocabulary decided by the product owner (2026-11-13)
    blacklist: [swap, exchange]
    replacements:
      swap: transfer
      exchange: account
      exchange rate: rate
  google:
    source: Play policy does not restrict wording for non-custodial wallets
    blacklist: []
    replacements: {}
catalogues:
  app: the root catalogue (localization/app_<lang>.arb)
entries:
  - {catalogue: app, key: swapRestoreTitle, store: apple, word: swap, euphemism: transfer}
  - {catalogue: app, key: swapRestoreActionable, store: apple, word: swap, euphemism: transfer}
