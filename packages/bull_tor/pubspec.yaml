name: bull_tor
description: Bull Mobile Tor lifecycle, embedded Onion, and external SOCKS integration.
publish_to: "none"
version: 0.0.1
resolution: workspace

environment:
  sdk: "3.14.0"
  flutter: "3.50.1"

dependencies:
  flutter:
    sdk: flutter
  rust_bindings:
  connectivity_plus: ^7.3.1
  get_it: ^9.1.1
  meta: ^1.17.0
  path_provider: ^2.1.5
  socks5_proxy: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        pluginClass: BullTorPlugin
