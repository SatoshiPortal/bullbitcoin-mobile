name: bull_payjoin
description: Pure-Dart Payjoin engine and public capability API for Bull Bitcoin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 7f3956c9a648bb19833694ec2e5b0c06bd200eca
      path: packages/bull_sdk
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.29.0
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  # Upstream Git builds are unlocked and enable test helpers; this pin is for compatibility testing, not verification of reproducible production builds.
  payjoin:
    git:
      url: https://github.com/payjoin/rust-payjoin
      ref: 0d80347e40ce7927960b799fd0946940732b8cd7
      path: payjoin-ffi/dart
  primitives:
  sqlite3: ^2.9.4
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  fake_async: ^1.3.3
  freezed: ^3.2.3
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
