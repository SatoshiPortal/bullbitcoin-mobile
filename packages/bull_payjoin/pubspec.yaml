      path: payjoin-ffi/dart
  primitives:
  sqlite3: ^2.9.4
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  fake_async: ^1.3.3
  freezed: ^3.2.3
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
