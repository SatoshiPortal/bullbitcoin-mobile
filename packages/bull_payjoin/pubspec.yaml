version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 88e05c9e9d2911f3dcd44b449ee97e27c73c1e51
      path: packages/bull_sdk
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.29.0
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
