name: bull_payjoin
description: Pure-Dart Payjoin engine and public capability API for Bull Bitcoin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.14.0 <4.0.0"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 50089d72ede5578428aa5c7c019cdb7accd6c4e5
      path: packages/bull_sdk
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.35.4
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  # Use the published archive for its release-locked native Cargo dependencies.
  payjoin: 0.26.0
  primitives:
  sqlite3: ^3.5.2
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  freezed: ^4.0.0
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
