[package]
name = "rust_lib_scuttle"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bark-wallet = { git = "https://github.com/ethicnology-agent/scuttle", rev = "2ad259dcf6c89d6b2ae8ae6153bdd454e1b6b7c5", default-features = false, features = ["sqlite-bundled", "native", "onchain-bdk", "tls-webpki-roots", "rand"] }
bitcoin = "0.32.7"
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
