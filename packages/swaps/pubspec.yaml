name: swaps
description: >-
  Self-contained Boltz swap engine for Bull Bitcoin: entities, status
  mapping, storage contract, repository (Boltz API + signing, no separate
  datasource layer by design), and the watcher that drives every swap to
  resolution (claim / refund / coop-sign). The app injects storage, wallet,
  fee and electrum ports; presentation stays in the app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.14.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  rust_bindings:
  boltz_stream:
  bolt11_decoder:
    git:
      url: https://github.com/fusion44/dart_bolt11_decoder
      ref: f5deec21fb0ac2ee507de1f683344b03f8cc92a3
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.35.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  legacy_storage:
  meta: ^1.17.0
  primitives:
  secrets:
  sqlite3: ^3.9.1
  synchronized: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  freezed: ^4.0.0
  json_serializable: ^6.11.2
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
