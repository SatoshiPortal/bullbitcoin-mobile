name: swaps
description: >-
  Self-contained Boltz swap engine for Bull Bitcoin: entities, status
  mapping, storage contract, repository (Boltz API + signing, no separate
  datasource layer by design), and the watcher that drives every swap to
  resolution (claim / refund / coop-sign). The app injects storage, wallet,
  fee and electrum ports; presentation stays in the app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: a4dd62d881675ef1f3065dfcd9f72fc3f6206820
      path: packages/bull_sdk
  boltz_stream:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: a4dd62d881675ef1f3065dfcd9f72fc3f6206820
      path: packages/boltz-stream
  bolt11_decoder:
    git:
      url: https://github.com/fusion44/dart_bolt11_decoder
      ref: f5deec21fb0ac2ee507de1f683344b03f8cc92a3
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  primitives:
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
