[package]
name = "dart_bwk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
bwk-sp  = { git = "https://github.com/SatoshiPortal/bwk", rev = "b06b78f3c1c7c22cdb4779f6a4eb084e0ab14ee1", package = "bwk-sp", features = ["sqlite"] }
bwk     = { git = "https://github.com/SatoshiPortal/bwk", rev = "b06b78f3c1c7c22cdb4779f6a4eb084e0ab14ee1", package = "bwk", features = ["sp"] }
bwk-tx  = { git = "https://github.com/SatoshiPortal/bwk", rev = "b06b78f3c1c7c22cdb4779f6a4eb084e0ab14ee1", package = "bwk-tx" }
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
log = "0.4"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
hex = "0.4"

[features]
bull_sdk = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(feature, values("continuous-scan"))'] }
