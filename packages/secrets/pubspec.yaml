name: secrets
description: >-
  The sole owner of user secrets (seed bytes, mnemonics, xprv) for the Bull
  wallet. Nothing outside this package can read raw secret material: callers get
  non-secret info (xpub, fingerprint, public descriptors), operation results
  (signed PSBT/PSET, encrypted vault, BIP85 derivations) or sealed display
  widgets. The seal is enforced by library-privacy + non-export of src/.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"
  flutter: "3.44.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  primitives:
    path: ../primitives
  bull_ui:
    path: ../bull_ui
  meta: ^1.17.0
  # Pure-Dart crypto.
  bip39_mnemonic: ^4.0.1
  bip32_keys: ^3.1.1
  bip85_entropy: ^1.0.2
  bs58check: ^1.0.2
  hex: ^0.2.0
  convert: ^3.1.2
  # Native FFI crypto/signing. bdk_dart + recoverbull are SHA-pinned. bull_sdk
  # mirrors the ROOT pubspec's `ref: main`; the root `dependency_overrides`
  # (ws-resilience) governs the actual resolved commit workspace-wide. NOTE
  # (supply-chain): a `main` ref is a MOVING target — pin it (and recoverbull)
  # to a SHA repo-wide when the app does; tracked as a follow-up, not introduced
  # by this package.
  bdk_dart:
    git:
      url: https://github.com/i5hi/bdk-dart
      ref: 6ddecbb360fb894068bdfd79ab0c10abf49b9fca
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: main
      path: packages/bull_sdk
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 9fd986d652a9c92492300249a46bf34b74043a65
  # Secure storage + screen privacy.
  flutter_secure_storage:
    git:
      url: https://github.com/SatoshiPortal/flutter_secure_storage
      ref: 0a0869d0ff0ba2b3cb3576c4a2350428dec30f77
      path: flutter_secure_storage
  no_screenshot: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
