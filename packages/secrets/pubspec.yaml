name: secrets
description: User secret material behind a custody boundary.
version: 1.0.0
publish_to: none
# repository: https://github.com/my_org/my_repo


environment:
  sdk: "3.12.2"
  flutter: "3.44.9"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  primitives:
  bull_logger:
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 88e05c9e9d2911f3dcd44b449ee97e27c73c1e51
      path: packages/bull_sdk
  flutter_secure_storage: ^10.3.3
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 92925c959f219fa4dfd0fe0f40392ddf868e2774
  bip32_keys: ^3.1.4
  bip39_mnemonic: ^4.1.0
  bip85_entropy: ^1.0.2
  convert: ^3.1.2
  # One process-wide lock, for the package's only read-modify-write.
  # Resolves on the version already in the workspace lockfile.
  synchronized: ^3.4.1
  meta: ^1.17.0
  # For `package:secrets/testing.dart`: the in-memory store is installed at the plugin's own seam, `FlutterSecureStoragePlatform.instance`, so consumers' tests run the real `Secrets` against a store they control.
  flutter_secure_storage_platform_interface: ^2.0.3

dev_dependencies:
  # The invariant tests read `lib/` as Dart, not as text: a regex over the
  # source let a `dynamic exportMnemonic()` through (Codex, M3, 2026-09-17).
  analyzer: ^10.2.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0