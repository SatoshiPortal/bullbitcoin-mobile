name: secrets
description: >-
  The sole owner of user secrets (seed bytes, mnemonics, xprv) for the Bull
  wallet. Nothing outside this package can read raw secret material: callers get
  non-secret info (xpub, fingerprint, public descriptors), operation results
  (signed PSBT/PSET, encrypted vault, BIP85 derivations) or sealed display
  widgets. The seal is enforced by library-privacy + non-export of src/.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"
  flutter: "3.44.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  primitives:
    path: ../primitives
  bull_ui:
    path: ../bull_ui
  meta: ^1.17.0
  # Pure-Dart crypto.
  bip39_mnemonic: ^4.0.1
  bip32_keys: ^3.1.1
  bip85_entropy: ^1.0.2
  bs58check: ^1.0.2
  hex: ^0.2.0
  convert: ^3.1.2
  # Native FFI crypto/signing. All git deps are SHA-pinned (supply-chain): a
  # moving `main`/branch ref lets `make deps-update` silently pull new upstream
  # code into signing/swap paths with no pubspec diff. bull_sdk is pinned to the
  # same commit the root dependency_overrides resolve workspace-wide (39a964b —
  # what `develop` also pins, so merging develop is a no-op on this ref).
  bdk_dart:
    git:
      url: https://github.com/bitcoindevkit/bdk-dart
      ref: 1377091a42743761be71ff42e01b8ff65531fbd3
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 39a964bdd1296a32fde514ffa450522c3bac576b
      path: packages/bull_sdk
  recoverbull:
    git:
      url: https://github.com/SatoshiPortal/recoverbull-client-dart.git
      ref: 9fd986d652a9c92492300249a46bf34b74043a65
  # Secure storage + screen privacy.
  flutter_secure_storage:
    git:
      url: https://github.com/SatoshiPortal/flutter_secure_storage
      ref: 0a0869d0ff0ba2b3cb3576c4a2350428dec30f77
      path: flutter_secure_storage
  # Hardware-backed secret storage (oubliette primary, FSS fallback — Phase 1).
  # Git-pinned to the IMMUTABLE security-hardening commit (PR #1) — a SHA, not
  # the branch head, so a force-push/GC can't silently re-resolve it. oubliette
  # and its siblings (keychain/keystore/secret_service) are unpublished, so all
  # four must resolve from the same git ref. The root dependency_overrides force
  # the three siblings to the same ref (oubliette pins them as hosted ^1.0.0 and
  # pub won't mix a hosted constraint with a git source).
  #
  # ⚠️ PROVENANCE (must resolve before ship): this SHA is reachable only from an
  # UNMERGED PR branch on an INDIVIDUAL's repo (ethicnology/dart-oubliette). That
  # is a supply-chain + availability risk for a custody wallet's hardware-storage
  # layer — a force-push/GC on the personal fork can make the commit unfetchable
  # (breaks `pub get` + reproducible builds). REQUIRED ACTION: mirror this commit
  # into a SatoshiPortal-org repo (or land PR #1 upstream) and re-pin `url:` here.
  oubliette:
    git:
      url: https://github.com/ethicnology/dart-oubliette.git
      ref: 71ddecc437c4a38ae61805db99c9f5e6abce0d79
      path: oubliette
  no_screenshot: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
