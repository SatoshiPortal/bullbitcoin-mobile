version: 0.0.1
resolution: workspace

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  logging_colorful: ^1.3.2
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  file_picker: ^13.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
