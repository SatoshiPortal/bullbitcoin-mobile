  test: ^1.26.3
  flutter_gen_runner: any
  drift_dev: ^2.35.3
  melos: ^8.10.1
  # Manifest parsers for tools/novlang_bridge.dart and tools/workspace_graph.dart.
  yaml: ^3.1.3
  toml: ^0.18.0
  bloc_test: ^10.0.0

# Payjoin 0.26.0's archive predates upstream's hooks-2 metadata-only fix:
# https://github.com/payjoin/rust-payjoin/commit/6c39a08
# Keep the official archive; remove these once its released constraints allow 2.
dependency_overrides:
  # UPower 0.7 metadata still requires dbus 0.7. Its unchanged runtime passes
  # all 14 upstream tests with 0.8; remove after battery_plus/UPower update.
  dbus: ^0.8.0
  hooks: ^2.0.2
  code_assets: ^2.0.0

hooks:
  user_defines:
    payjoin:
      build: source
    sqlite3:
      source: sqlite3mc

# Melos monorepo workspace. The Flutter app remains at the root
# (useRootAsPackage) while shared modules are extracted incrementally into the
# `resolution: workspace` members listed above.
# Invoke via `make bootstrap` (wraps `fvm dart run melos` so the pinned SDK in
# .fvmrc is used); never run bare `melos`.
melos:
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  command:
    bootstrap:
      enforceLockfile: true

flutter:
  # Android product flavors live in android/app/build.gradle (production | beta).
  # Without an explicit --flavor (e.g. `flutter run`, IDE launches, integration
  # tests) Flutter builds this default, so existing workflows keep working.
  default-flavor: production
  generate: true # Needed for code generation, for example for internationalization
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/logos/
    - assets/backgrounds/
    - assets/animations/
    - assets/misc/

  fonts:
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText.ttf
        - asset: assets/fonts/GolosText.ttf
          weight: 500
        - asset: assets/fonts/GolosText.ttf
          weight: 700

flutter_native_splash:
  background_image: "assets/logos/bb-logo-white-splash.png"
  android_12:
    color: "#C50909"
    image: assets/logos/bb-logo-white-splash.png
    # icon_background_color: "#C50909"
    icon_background_color: "#C50909"

  color_android: "#C50909"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/icon-black-red.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/logos/icon-black-red.png"
  adaptive_icon_foreground: "assets/logos/icon-black-red.png"
