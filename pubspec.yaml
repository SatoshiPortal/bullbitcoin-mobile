dependency_overrides:
  # Force bull_sdk workspace-wide to the SAME pinned commit the root direct deps
  # and packages/secrets both use — 39a964b, which is what `develop` pins (one
  # commit past the earlier db80946: "pin boltz & lwk to v0.5.0 tags"). Aligning
  # to develop keeps this branch from regressing bull_sdk on merge. All sides now
  # use the identical SHA, so this override is belt-and-suspenders (it also keeps
  # any other workspace package that resolves bull_sdk on the same commit).
  bull_sdk:
    git:
      url: https://github.com/SatoshiPortal/bull_sdk
      ref: 39a964bdd1296a32fde514ffa450522c3bac576b
      path: packages/bull_sdk
  # oubliette integration (Phase 1): force its sibling plugins to the same git
  # ref as the oubliette dep in packages/secrets. oubliette declares them as
  # hosted ^1.0.0 (unpublished); pub won't mix a hosted constraint with a git
  # source, so the root overrides the source here. Pinned to the IMMUTABLE
  # security-hardening commit (PR #1) — a SHA, not the branch head, so a
  # force-push/GC can't silently re-resolve `--enforce-lockfile` / deps-update.
  keychain:
    git:
      url: https://github.com/ethicnology/dart-oubliette.git
      ref: 71ddecc437c4a38ae61805db99c9f5e6abce0d79
      path: keychain
  keystore:
    git:
      url: https://github.com/ethicnology/dart-oubliette.git
      ref: 71ddecc437c4a38ae61805db99c9f5e6abce0d79
      path: keystore
  secret_service:
    git:
      url: https://github.com/ethicnology/dart-oubliette.git
      ref: 71ddecc437c4a38ae61805db99c9f5e6abce0d79
      path: secret_service
  # CONFLICT: oubliette declares pointycastle ^4.0.0 (Argon2id); ledger_bitcoin
  # pins ^3.7.4 (<4) — disjoint, so version-solving fails without this override.
  #
  # VERIFIED SAFE (static audit, 2026-07): the forced 4.x does NOT break Ledger.
  # ledger_bitcoin's ONLY pointycastle usage is `RIPEMD160Digest().process(...)`
  # (packages/ledger-bitcoin/lib/src/utils/utils.dart) — a Digest API that is
  # unchanged from 3.x to 4.x. So Ledger signing compiles and runs identically
  # on 4.x. (On-device smoke-test of a Ledger sign still recommended, but there
  # is no 4.x breaking change on the code path Ledger actually exercises.)
  #
  # DURABLE FIX (preferred once oubliette is re-pinned — see the git refs above):
  # relax oubliette's declared constraint to `>=3.7.4 <5`. pointycastle 3.9.1
  # already ships Argon2id AND is byte-identical to 4.0.0 for every API oubliette
  # uses (Argon2, GCMBlockCipher/AESEngine, HKDFKeyDerivator — all diff-verified),
  # and 3.9.1 satisfies ledger's `^3.7.4`. pub would then pick 3.9.1 for BOTH and
  # this override could be deleted entirely.
  pointycastle: ^4.0.0
dev_dependencies:
  build_runner: ^2.10.4
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
